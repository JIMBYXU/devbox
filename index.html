<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevBox - 免费在线开发者工具箱</title>
<meta name="description" content="13款免费在线开发工具，数据不上传，即开即用">
<meta name="robots" content="index, follow">
<meta property="og:title" content="DevBox - 免费在线开发者工具箱">
<meta property="og:description" content="13款免费在线开发者工具">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--primary:#6366f1;--primary-hover:#818cf8;--success:#22c55e;--error:#ef4444;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:24px 20px}
.header{text-align:center;padding:40px 0 32px}
.header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--muted);margin-top:8px;font-size:1.05rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;justify-content:center}
.tab{padding:10px 20px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:.92rem;font-weight:500;transition:.2s;display:flex;align-items:center;gap:6px;user-select:none}
.tab:hover{border-color:var(--primary);color:var(--text)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tool-panel{display:none}
.tool-panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card h2{font-size:1.25rem;margin-bottom:16px}
textarea,input[type=text],input[type=number],select{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.9rem;resize:vertical;transition:.2s}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
textarea{min-height:180px}
.btn{padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#475569}
.btn-sm{padding:6px 14px;font-size:.82rem;border-radius:6px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row{display:flex;gap:16px}
.col{flex:1;min-width:0}
.info-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:.85rem;margin-top:10px}
.info-bar.success{background:rgba(34,197,94,.1);color:var(--success);border:1px solid rgba(34,197,94,.2)}
.info-bar.error{background:rgba(239,68,68,.1);color:var(--error);border:1px solid rgba(239,68,68,.2)}
.qr-container{text-align:center}
#qrcode-canvas{margin:16px auto;display:block;max-width:100%;border-radius:8px;background:#fff;padding:12px}
.diff-pane{overflow-x:auto}
.diff-added{background:rgba(34,197,94,.15);color:#4ade80}
.diff-removed{background:rgba(239,68,68,.15);color:#f87171}
.diff-line{padding:2px 8px;font-family:monospace;font-size:.85rem;white-space:pre;border-radius:2px}
.color-preview{width:60px;height:60px;border-radius:12px;border:2px solid var(--border);flex-shrink:0}
.footer{text-align:center;padding:40px 0 24px;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;background:var(--success);color:#fff;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:1000}
.toast.show{opacity:1}
@media(max-width:640px){.row{flex-direction:column}.header h1{font-size:1.7rem}.tab{padding:8px 14px;font-size:.82rem}.card{padding:16px}}
</style>
</head>
<body>
<div class="container">
<header class="header"><h1>🛠 DevBox</h1><p>开发者在线工具箱 · 免费 · 无需注册 · 数据不上传</p></header>
<nav class="tabs" id="tabs">
  <button class="tab active" data-tool="json" onclick="switchTab('json',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/><path d="M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/><path d="M16 12h4"/><path d="M4 12h8"/></svg>JSON</button>
  <button class="tab" data-tool="diff" onclick="switchTab('diff',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>文本对比</button>
  <button class="tab" data-tool="qr" onclick="switchTab('qr',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M7 7h4v4H7z"/><path d="M13 7h4v4h-4z"/><path d="M7 13h4v4H7z"/></svg>二维码</button>
  <button class="tab" data-tool="base64" onclick="switchTab('base64',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20h8"/><path d="M4 16h12"/><path d="M4 12h12"/></svg>Base64</button>
  <button class="tab" data-tool="ts" onclick="switchTab('ts',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>时间戳</button>
  <button class="tab" data-tool="color" onclick="switchTab('color',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 18a6 6 0 100-12 6 6 0 000 12z"/></svg>颜色转换</button>
  <button class="tab" data-tool="url" onclick="switchTab('url',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>URL</button>
  <button class="tab" data-tool="hash" onclick="switchTab('hash',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3L8 21"/><path d="M16 3l-2 18"/></svg>哈希</button>
  <button class="tab" data-tool="uuid" onclick="switchTab('uuid',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M9 15h.01"/><path d="M15 15h.01"/></svg>UUID</button>
  <button class="tab" data-tool="regex" onclick="switchTab('regex',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M7 12l3-3 2 2 5-5"/></svg>正则</button>
  <button class="tab" data-tool="pw" onclick="switchTab('pw',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11h14a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2v-7a2 2 0 012-2z"/><path d="M7 11V7a5 5 0 0110 0v4"/><path d="M12 16a1 1 0 100 2 1 1 0 000-2z"/></svg>密码</button>
  <button class="tab" data-tool="img" onclick="switchTab('img',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M8.5 8.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path d="M21 15l-5-5L5 21"/></svg>图片Base64</button>
  <button class="tab" data-tool="unit" onclick="switchTab('unit',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v4"/><path d="M4 14v6"/><path d="M10 1h4"/><path d="M20 10v4"/><path d="M14 20h4"/></svg>单位换算</button>

<!-- JSON -->
<div class="tool-panel active" id="panel-json">
<div class="card"><h2>📋 JSON 格式化 & 验证</h2>
<textarea id="json-input" placeholder="粘贴 JSON 字符串"></textarea>
<div class="btn-group">
<button class="btn btn-primary" onclick="formatJSON()">✨ 格式化</button>
<button class="btn btn-secondary" onclick="compressJSON()">🗜 压缩</button>
<button class="btn btn-secondary" onclick="validateJSON()">✅ 验证</button>
<button class="btn btn-sm btn-secondary" onclick="copyText('json-input')">📋 复制</button>
</div><div id="json-status"></div></div>
<div class="card"><h2>📊 树形视图</h2><div id="json-tree" style="font-family:monospace;font-size:.88rem;overflow-x:auto"></div></div>
</div>

<!-- Diff -->
<div class="tool-panel" id="panel-diff">
<div class="card"><h2>📝 文本差异对比</h2>
<div class="row"><div class="col"><label style="display:block;margin-bottom:6px;color:var(--muted);font-size:.85rem">原始文本</label><textarea id="diff-original" placeholder="粘贴原始文本"></textarea></div>
<div class="col"><label style="display:block;margin-bottom:6px;color:var(--muted);font-size:.85rem">修改后文本</label><textarea id="diff-modified" placeholder="粘贴修改后文本"></textarea></div></div>
<div class="btn-group"><button class="btn btn-primary" onclick="compareDiff()">🔍 对比差异</button>
<button class="btn btn-sm btn-secondary" onclick="clearDiff()">🗑 清空</button></div></div>
<div class="card"><h2>📊 对比结果</h2><div class="diff-pane" id="diff-result"><span style="color:var(--muted)">点击对比查看结果</span></div></div>
</div>

<!-- QR -->
<div class="tool-panel" id="panel-qr">
<div class="card"><h2>📱 二维码生成器</h2>
<div class="row" style="align-items:flex-end"><div class="col" style="flex:2"><input type="text" id="qr-text" placeholder="输入文本或网址" oninput="generateQR()"></div>
<div class="col"><input type="number" id="qr-size" value="256" min="128" max="1024" onchange="generateQR()" style="width:100px"></div></div>
<div class="qr-container"><canvas id="qrcode-canvas"></canvas></div>
<div class="btn-group" style="justify-content:center"><button class="btn btn-primary" onclick="downloadQR()">💾 下载 PNG</button></div></div>
</div>

<!-- Base64 -->
<div class="tool-panel" id="panel-base64">
<div class="card"><h2>🔐 Base64 编解码</h2>
<textarea id="base64-input" placeholder="输入文本或 Base64 字符串"></textarea>
<div class="btn-group"><button class="btn btn-primary" onclick="encodeBase64()">🔒 编码</button>
<button class="btn btn-primary" onclick="decodeBase64()">🔓 解码</button>
<button class="btn btn-sm btn-secondary" onclick="copyText('base64-input')">📋 复制</button></div></div>
</div>

<!-- Timestamp -->
<div class="tool-panel" id="panel-ts">
<div class="card"><h2>⏰ 时间戳转换</h2>
<div style="margin-bottom:16px"><span style="color:var(--muted);font-size:.9rem">当前：</span><code id="current-ts" style="background:var(--bg);padding:6px 12px;border-radius:6px;font-size:1.1rem"></code></div>
<div class="row" style="align-items:flex-end"><div class="col" style="flex:2"><input type="text" id="ts-input" placeholder="输入时间戳 或 日期"></div>
<div class="col" style="flex:0 0 auto"><button class="btn btn-primary" onclick="convertTimestamp()">🔄 转换</button></div></div>
<div id="ts-result" style="margin-top:16px"></div></div>
</div>

<!-- Color -->
<div class="tool-panel" id="panel-color">
<div class="card"><h2>🎨 颜色格式转换</h2>
<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px"><input type="text" id="color-input" placeholder="#6366f1 或 rgb(99,102,241)" oninput="convertColor()"><div id="color-results" style="margin-top:14px"></div></div>
<div class="color-preview" id="color-preview" style="background:#6366f1"></div></div>
<div class="btn-group"><button class="btn btn-sm btn-secondary" onclick="randomColor()">🎲 随机</button>
<button class="btn btn-sm btn-secondary" onclick="copyText('color-input')">📋 复制</button></div></div>
</div>

<!-- URL -->
<div class="tool-panel" id="panel-url">
<div class="card"><h2>🔗 URL 编解码</h2>
<textarea id="url-input" placeholder="输入文本或 URL 编码字符串"></textarea>
<div class="btn-group"><button class="btn btn-primary" onclick="encodeURL()">🔒 编码</button>
<button class="btn btn-primary" onclick="decodeURL()">🔓 解码</button>
<button class="btn btn-sm btn-secondary" onclick="copyText('url-input')">📋 复制</button></div></div>
</div>

<!-- Hash -->
<div class="tool-panel" id="panel-hash">
<div class="card"><h2>🔐 哈希计算</h2>
<textarea id="hash-input" placeholder="输入文本"></textarea>
<div class="btn-group">
<button class="btn btn-primary" onclick="computeHash('MD5')">MD5</button>
<button class="btn btn-primary" onclick="computeHash('SHA-1')">SHA-1</button>
<button class="btn btn-primary" onclick="computeHash('SHA-256')">SHA-256</button>
<button class="btn btn-primary" onclick="computeHash('SHA-512')">SHA-512</button>
</div><div id="hash-result" style="margin-top:14px"></div></div>
</div>

<!-- UUID -->
<div class="tool-panel" id="panel-uuid">
<div class="card"><h2>🆔 UUID 生成器</h2>
<div class="btn-group" style="margin-bottom:16px">
<button class="btn btn-primary" onclick="generateUUIDs(1)">生成 1 个</button>
<button class="btn btn-primary" onclick="generateUUIDs(5)">生成 5 个</button>
<button class="btn btn-primary" onclick="generateUUIDs(10)">生成 10 个</button>
<button class="btn btn-primary" onclick="generateUUIDs(50)">生成 50 个</button>
<button class="btn btn-sm btn-secondary" onclick="document.getElementById('uuid-list').innerHTML=''">🗑 清空</button>
</div><div id="uuid-list" style="font-family:monospace;font-size:.85rem;line-height:2"></div></div>
</div>

<!-- Regex -->
<div class="tool-panel" id="panel-regex">
<div class="card"><h2>🔍 正则测试器</h2>
<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><span style="font-family:monospace;font-size:1.1rem;color:var(--muted)">/</span><input type="text" id="regex-pattern" placeholder="正则表达式" oninput="testRegex()" style="flex:1;min-width:200px"><span style="font-family:monospace;font-size:1.1rem;color:var(--muted)">/</span><input type="text" id="regex-flags" placeholder="gim" oninput="testRegex()" style="width:70px;text-align:center" maxlength="6"></div>
<textarea id="regex-input" placeholder="测试文本" oninput="testRegex()" style="min-height:120px"></textarea>
<div id="regex-result" style="margin-top:14px"></div></div>
</div>

<!-- Password -->
<div class="tool-panel" id="panel-pw">
<div class="card"><h2>🔑 密码生成器</h2>
<div style="margin-bottom:16px"><label style="display:block;margin-bottom:6px;color:var(--muted);font-size:.85rem">长度: <strong id="pw-len-label">16</strong></label><input type="range" id="pw-length" min="8" max="64" value="16" oninput="document.getElementById('pw-len-label').textContent=this.value" style="width:100%;accent-color:var(--primary)"></div>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="pw-upper" checked> 大写</label>
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="pw-lower" checked> 小写</label>
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="pw-number" checked> 数字</label>
<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="pw-symbol" checked> 符号</label></div>
<div id="pw-display" style="background:var(--bg);padding:16px;border-radius:8px;font-family:monospace;font-size:1.2rem;word-break:break-all;min-height:50px">点击生成</div>
<div class="btn-group"><button class="btn btn-primary" onclick="generatePassword()">🎲 生成</button>
<button class="btn btn-sm btn-secondary" onclick="copyPassword()">📋 复制</button></div>
<div id="pw-strength" style="margin-top:10px"></div></div>
</div>

<!-- Image Base64 -->
<div class="tool-panel" id="panel-img">
<div class="card"><h2>🖼 图片转 Base64</h2>
<div style="border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;margin-bottom:16px" id="img-dropzone" ondragover="event.preventDefault();this.style.borderColor='var(--primary)'" ondragleave="this.style.borderColor='var(--border)'" ondrop="handleImageDrop(event)" onclick="document.getElementById('img-file').click()">
<input type="file" id="img-file" accept="image/*" onchange="handleImageSelect(this)" style="display:none">
<div style="font-size:2.5rem;margin-bottom:8px">📁</div><div style="color:var(--muted)">点击或拖拽上传图片</div></div>
<div id="img-preview" style="text-align:center;margin-bottom:12px;display:none"><img id="img-preview-el" style="max-width:100%;max-height:200px;border-radius:8px"><div id="img-info" style="color:var(--muted);font-size:.85rem;margin-top:6px"></div></div>
<div class="btn-group"><button class="btn btn-primary" onclick="convertImage()" id="img-convert-btn" disabled>🔄 转换</button>
<button class="btn btn-sm btn-secondary" onclick="copyText('img-result')">📋 复制</button></div>
<textarea id="img-result" placeholder="Base64 结果" style="margin-top:12px;min-height:80px;font-size:.8rem" readonly></textarea></div>
</div>

<!-- Unit -->
<div class="tool-panel" id="panel-unit">
<div class="card"><h2>📐 单位换算器</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px" id="unit-cats">
<button class="btn btn-sm btn-primary unit-cat" data-cat="length">📏 长度</button>
<button class="btn btn-sm btn-secondary unit-cat" data-cat="weight">⚖ 重量</button>
<button class="btn btn-sm btn-secondary unit-cat" data-cat="temp">🌡 温度</button>
<button class="btn btn-sm btn-secondary unit-cat" data-cat="area">📐 面积</button>
<button class="btn btn-sm btn-secondary unit-cat" data-cat="volume">🧴 体积</button>
<button class="btn btn-sm btn-secondary unit-cat" data-cat="speed">🚀 速度</button>
</div>
<div class="row" style="align-items:flex-end"><div class="col"><input type="number" id="unit-value" value="1" oninput="convertUnit()" style="font-size:1.1rem"></div>
<div class="col"><select id="unit-from" onchange="convertUnit()" style="padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem"></select></div>
<div style="display:flex;align-items:center;padding-bottom:4px"><span style="font-size:1.3rem;color:var(--primary)">→</span></div>
<div class="col"><select id="unit-to" onchange="convertUnit()" style="padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem"></select></div></div>
<div id="unit-result" style="margin-top:16px;font-size:1.3rem;text-align:center;font-family:monospace;background:var(--bg);padding:16px;border-radius:8px"></div></div>
</div>

<footer class="footer"><p>DevBox · 数据仅在浏览器本地处理</p></footer>
</div>
<div class="toast" id="toast"></div>
<script>
function switchTab(tool,btn){
var i,ts=document.querySelectorAll(".tab"),ps=document.querySelectorAll(".tool-panel");
for(i=0;i<ts.length;i++)ts[i].classList.remove("active");
for(i=0;i<ps.length;i++)ps[i].classList.remove("active");
btn.classList.add("active");
var p=document.getElementById("panel-"+tool);if(p)p.classList.add("active");
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}
function copyText(id){var e=document.getElementById(id);if(!e||!e.value||!e.value.trim()){toast("⚠ 内容为空");return}navigator.clipboard.writeText(e.value).then(function(){toast("✅ 已复制")})}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function showStatus(id,m,t){var e=document.getElementById(id);if(e)e.innerHTML="<div class=info-bar "+t+">"+m+"</div>"}
function renderTree(v,d){
var sp="  ".repeat(d);
if(v===null)return "<span style=color:#94a3b8>null</span>";
if(typeof v==="boolean")return "<span style=color:#f472b6>"+v+"</span>";
if(typeof v==="number")return "<span style=color:#facc15>"+v+"</span>";
if(typeof v==="string")return "<span style=color:#4ade80>\""+esc(v)+"\"</span>";
if(Array.isArray(v)){if(v.length===0)return "<span style=color:#94a3b8>[]</span>";var s="[";for(var i=0;i<v.length;i++){s+="\n"+"  ".repeat(d+1)+renderTree(v[i],d+1);if(i<v.length-1)s+=","}return s+"\n"+"  ".repeat(d)+"]"}
var ks=Object.keys(v);if(ks.length===0)return "<span style=color:#94a3b8>{}</span>";
